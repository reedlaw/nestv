name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install --yes verilator
      - name: Lint and simulate
        run: make check
